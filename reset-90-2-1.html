<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RESET — 90 Days</title>
<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--tx:#2b2f2c;--mu:#7a7f78;--ac:#7fa37b;--ac2:#dfeadb;--bl:#7d8fa0;--bd:#e8e2d3;--sh:0 2px 10px #0000000d}
:root[data-theme=dark]{--bg:#1b1f1c;--card:#242a26;--tx:#e9ece6;--mu:#98a095;--ac:#8fb58a;--ac2:#2f3d2f;--bl:#9bb0c3;--bd:#333b35;--sh:none}
@media(prefers-color-scheme:dark){:root[data-theme=system]{--bg:#1b1f1c;--card:#242a26;--tx:#e9ece6;--mu:#98a095;--ac:#8fb58a;--ac2:#2f3d2f;--bl:#9bb0c3;--bd:#333b35;--sh:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3{font-family:Georgia,serif;font-weight:500;margin:.3em 0}
main{max-width:640px;margin:auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.mu{color:var(--mu);font-size:.9rem}
.bar{height:8px;background:var(--ac2);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .6s}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;padding:12px 0;border:0;background:none;color:var(--mu);font-size:.8rem;min-height:56px;cursor:pointer}
nav button.on{color:var(--ac);font-weight:600}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;width:100%;min-height:44px}
button.b{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:12px 18px;font:inherit;min-height:48px;cursor:pointer;width:100%}
button.g{background:none;border:0;color:var(--mu);padding:12px;font:inherit;width:100%;cursor:pointer;min-height:48px}
.row{display:flex;gap:8px;align-items:center}
.top{padding-top:env(safe-area-inset-top,0)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal button{aspect-ratio:1;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:.75rem;cursor:pointer}
.cal .s{background:var(--ac2)}.cal .j{box-shadow:inset 0 0 0 2px var(--bl)}.cal .t{outline:2px solid var(--ac)}
.ov{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;align-items:center;justify-content:center;padding:24px}
.ov>div{max-width:380px;width:100%;text-align:center}
#fab{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0));border:0;background:var(--card);border-radius:50%;width:60px;height:60px;box-shadow:0 3px 14px #0003;cursor:pointer;padding:0}
#chat{position:fixed;right:10px;left:10px;bottom:calc(140px + env(safe-area-inset-bottom,0));max-width:420px;margin-left:auto;max-height:60vh;display:none;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:12px;z-index:5;box-shadow:0 6px 24px #0003}
#msgs{overflow:auto;flex:1;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.m{padding:8px 12px;border-radius:14px;max-width:85%;white-space:pre-wrap}
.m.u{background:var(--ac2);align-self:flex-end}.m.a{background:var(--bg);align-self:flex-start}
@media(min-width:900px){body{padding:0 0 0 200px}nav{top:0;right:auto;bottom:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding-top:30px}nav button{text-align:left;padding-left:24px;flex:none}#fab{bottom:20px}#chat{bottom:90px}}

/* ---------- v3 animation system (all short, purposeful, reduced-motion safe) ---------- */
:root{--ease:cubic-bezier(.22,1,.36,1)}
body{animation:fade .5s var(--ease)}
@keyframes fade{from{opacity:0}}
@keyframes pg{from{opacity:0;transform:translateY(8px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #7fa37b66}60%{box-shadow:0 0 0 6px #7fa37b00}}
@keyframes gro{from{transform:scaleY(0)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.pg{animation:pg .35s var(--ease)}
.pg .gb{transform-origin:bottom;animation:gro .6s var(--ease) backwards}
.card{transition:opacity .4s var(--ease),transform .4s var(--ease),box-shadow .25s,border-color .25s}
.card.pre{opacity:0;transform:translateY(10px)}
.okc{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
.dp{animation:rise .3s var(--ease)}
.ck.fresh{display:inline-block;animation:pop .4s var(--ease)}
.qt{display:inline-block;transition:opacity .25s}
.m{animation:rise .3s var(--ease)}
button{transition:transform .15s var(--ease),box-shadow .2s,background-color .2s,color .25s}
button:active{transform:scale(.97)!important}
@media(hover:hover){button.b:hover{box-shadow:0 4px 12px #0002;transform:translateY(-1px)}button.g:hover{color:var(--tx)}.card:hover{box-shadow:0 6px 18px #00000014;border-color:var(--ac)}}
nav button{transition:color .25s,background-color .25s}
#chat{display:flex;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(8px) scale(.96);transform-origin:bottom right;transition:opacity .25s,transform .3s var(--ease),visibility .25s}
#chat.open{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0));background:var(--card);border:1px solid var(--bd);padding:8px 16px;border-radius:20px;box-shadow:var(--sh);animation:toast 1.8s var(--ease) forwards;z-index:12}
/* today's plan timeline */
.tl{list-style:none;margin:10px 0 0;padding:0}
.tl li{display:flex;gap:12px;padding:8px 0;position:relative;transition:opacity .3s}
.tl li:not(:last-child)::before{content:"";position:absolute;left:7px;top:28px;bottom:-4px;width:2px;background:var(--bd)}
.tl .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--bd);flex:none;margin-top:4px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .3s}
.tl .past{opacity:.6}.tl .past .dot{background:var(--ac2);border-color:var(--ac)}.tl .past .dot::after{content:"✓";color:var(--ac)}
.tl .now .dot{background:var(--ac);border-color:var(--ac);animation:pulse 2.4s infinite}
.pill{font-size:.72rem;background:var(--ac2);color:var(--ac);padding:2px 8px;border-radius:10px;margin-left:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g2 svg{width:104px;height:104px}
@media(min-width:900px){main{max-width:1000px}.hg{display:grid;grid-template-columns:62fr 38fr;gap:20px;align-items:start}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}}
</style></head><body>
<main id="app"></main>
<nav id="nav"></nav>
<button id="fab" aria-label="Open Mitra assistant"></button>
<div id="chat"><div id="msgs"></div><div class="row"><input id="cin" placeholder="Ask Mitra…"><button class="b" id="csend" style="width:auto">Send</button></div></div>
<div id="ob" class="ov" style="display:none"></div>
<script>
// ---------- cute assistant icon (Mitra = "friend" in Marathi) ----------
const mitra=(s=48)=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 14c-1-7 5-11 12-10-1 7-6 11-12 10z" fill="#8fae8b"/><path d="M32 16v6" stroke="#6b8f6a" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="40" r="22" fill="#b9d3b4"/><circle cx="24" cy="39" r="3" fill="#2f3b33"/><circle cx="40" cy="39" r="3" fill="#2f3b33"/><circle cx="18" cy="46" r="4" fill="#f4b8a8" opacity=".75"/><circle cx="46" cy="46" r="4" fill="#f4b8a8" opacity=".75"/><path d="M27 48q5 5 10 0" stroke="#2f3b33" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;
// ---------- data ----------
// Trackers: add a new one by adding a line here (+ an input in trackCard if needed)
const T=[
 {id:'coding',n:'Coding',e:'💻',t:60},{id:'reading',n:'Reading',e:'📖',t:20},
 {id:'study',n:'College Study',e:'📚',t:45},{id:'walking',n:'Walking',e:'🚶',t:30},
 {id:'meditation',n:'Meditation',e:'🧘',t:10},{id:'sleep',n:'Sleep',e:'😴',t:420},
 {id:'supari',n:'Supari',e:'🥥',t:0},{id:'starts',n:'5-Minute Rule',e:'⏱',t:1}];
const PLAN=[16,16,15,15,14,14,13,13,12,12,11,11,10,10,9,9,8,8,7,7,6,6,5,5,4,3,2,2,1,0];
const Q=["Start small. Stay consistent.","You don't need a perfect day. You need a day you showed up.","Five minutes is enough to begin.","Slow progress is still progress.","Break झाला? पुन्हा सुरू कर.","Consistency beats intensity.","One ordinary day at a time.","आज फक्त सुरुवात कर.","थोडं थोडं करून खूप पुढे जाता येतं.","Keep going, quietly.","तुला perfect व्हायचं नाही. तुला consistent व्हायचं आहे."];
const KEY='reset90';
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
// ---------- data safety: defaults + migration (also used when importing) ----------
const DEFAULTS=()=>({set:{name:'Pratik',start:'2026-10-03',theme:'system',key:'',onboarded:false},days:{},refl:{},tt:defaultTT(),ttv:2});
const NUMS=['coding','reading','study','walking','meditation','supari','starts','pages'];
function normalize(x){const d=DEFAULTS();if(!x||typeof x!=='object')return d;
 const set={...d.set,...(x.set&&typeof x.set==='object'?x.set:{})};
 if(!/^\d{4}-\d{2}-\d{2}$/.test(set.start))set.start=d.set.start;
 if(!['light','dark','system'].includes(set.theme))set.theme='system';
 const days={};
 if(x.days&&typeof x.days==='object')for(const k in x.days){const e=x.days[k];
  if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!e||typeof e!=='object')continue; // skip junk entries
  const c={...e};
  NUMS.forEach(n=>{if(c[n]!==undefined&&c[n]!==''&&!isFinite(+c[n]))delete c[n]});
  ['sleepAt','wakeAt'].forEach(n=>{if(c[n]&&!/^\d{2}:\d{2}$/.test(c[n]))delete c[n]});
  days[k]=c}
 const okTT=i=>i&&typeof i.t==='string'&&/^\d{2}:\d{2}$/.test(i.s)&&/^\d{2}:\d{2}$/.test(i.e)&&Array.isArray(i.d);
 let tt=Array.isArray(x.tt)?x.tt.filter(okTT):defaultTT();
 if(x.ttv!==2)tt=migrateTT(tt); // one-time upgrade to the final schedule; custom/edited tasks are kept
 return{set,days,refl:x.refl&&typeof x.refl==='object'?x.refl:{},tt,ttv:2}}
S=normalize(S);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
// ---------- date helpers ----------
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[a,b,c]=s.split('-');return new Date(a,b-1,c)};
const today=()=>ymd(new Date());
const dayNo=s=>Math.round((parse(s)-parse(S.set.start))/864e5)+1; // Day 1 = start date
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
let view='home',sel=today(),det='coding',prevView='home',jsel=today(); // det = tracker shown on detail page, jsel = day picked on Journey
// ---------- tracker logic ----------
const tm=s=>{const[h,m]=s.split(':');return h*60+ +m};
function val(e,id){e=e||{};
 if(id==='sleep'){if(!e.sleepAt||!e.wakeAt)return null;let d=tm(e.wakeAt)-tm(e.sleepAt);if(d<=0)d+=1440;return d}
 return e[id]===undefined||e[id]===''?null:+e[id]}
const limit=date=>{const n=dayNo(date);return n>=1&&n<=30?PLAN[n-1]:0};
function ok(date,t){const v=val(S.days[date],t.id);if(v===null)return false;
 return t.id==='supari'?v<=limit(date):v>=t.t}
function streaks(t){let cur=0,best=0,run=0,total=0;const end=today();
 for(let d=S.set.start;d<=end;d=addDays(d,1)){if(ok(d,t)){run++;total++;best=Math.max(best,run)}else if(d!==end)run=0}
 // current streak counts back from today (or yesterday if today isn't done yet)
 let d=end;if(!ok(d,t))d=addDays(d,-1);
 while(d>=S.set.start&&ok(d,t)){cur++;d=addDays(d,-1)}
 return{cur,best,total}}
const fmt=(m,id)=>id==='sleep'?(m===null?'—':Math.floor(m/60)+'h '+m%60+'m'):(m===null?'—':m);
function status(date,t){const v=val(S.days[date],t.id),tick=`<span class="ck" data-ck="${date}${t.id}">✓</span>`;
 if(t.id==='supari'){if(v===null)return'Not logged yet';return v<=limit(date)?tick+' Within today\'s maximum':'○ Over today\'s maximum — tomorrow is a fresh start'}
 return ok(date,t)?tick+' Threshold met':'○ Not met'}
const SUBS=['a glass of water','saunf (fennel)','a short walk','cardamom','1 minute of slow breaths'];
// ---------- UI pieces ----------
const unit=t=>t.id==='sleep'?'':t.id==='supari'?' pudya':t.id==='starts'?' task':' min';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// One reusable tracker card. edit=true shows inputs; noLink=true hides the Details button.
function card(t,date,edit,noLink){const e=S.days[date]||{},v=val(e,t.id),isS=t.id==='supari';
 const thr=isS?limit(date):t.t,pct=Math.min(100,v===null?0:thr?v/thr*100:(v===0?100:0));
 const st=streaks(t);
 let h=`<div class="card${ok(date,t)?' okc':''}"><div class="row"><b style="flex:1">${t.e} ${t.n}</b><span class="mu">${st.cur?'🌱 '+st.cur+' day'+(st.cur>1?'s':''):''}</span></div>
 <div style="font-size:1.4rem">${fmt(v,t.id)}<span class="mu"> / ${t.id==='sleep'?'7h':thr}${unit(t)} ${isS?'maximum':'minimum'}</span></div>
 <div class="bar" role="progressbar" aria-valuenow="${Math.round(pct)}"><i style="width:${pct}%"></i></div><div>${status(date,t)}</div>`;
 if(isS)h+=`<div class="mu">Remaining allowance: ${v===null?thr:Math.max(0,thr-v)} · Reduced from Day 1 (${PLAN[0]}): ${PLAN[0]-thr}</div>`;
 if(edit){
  if(t.id==='sleep')h+=`<div class="row" style="margin-top:8px"><label style="flex:1" class="mu">Slept<input type="time" data-k="sleepAt" value="${e.sleepAt||'01:00'}"></label><label style="flex:1" class="mu">Woke<input type="time" data-k="wakeAt" value="${e.wakeAt||'08:00'}"></label></div><div class="mu">Tomorrow is another chance.</div>`;
  else h+=`<input type="number" min="0" inputmode="numeric" data-k="${t.id}" value="${v??''}" placeholder="${isS?'pudya today':t.id==='starts'?'tasks started':'minutes'}" style="margin-top:8px" aria-label="${t.n}">`;
  if(t.id==='coding')h+=`<input data-k="topic" value="${esc(e.topic)}" placeholder="Topic / what I built" style="margin-top:6px">`;
  if(t.id==='reading')h+=`<input data-k="book" value="${esc(e.book)}" placeholder="Book name" style="margin-top:6px">`;
  if(t.id==='study')h+=`<select data-k="subject" style="margin-top:6px">${['','Revision','Assignment','Practical','Notes','Exam preparation'].map(o=>`<option ${e.subject===o?'selected':''}>${o}</option>`).join('')}</select>`;
  if(isS)h+=`<select data-k="trigger" style="margin-top:6px">${['','Tea','Meal','Study','Practical','Stress','Boredom','Random urge','Other'].map(o=>`<option value="${o}" ${e.trigger===o?'selected':''}>${o||'Craving trigger (optional)'}</option>`).join('')}</select><input data-k="helped" value="${esc(e.helped)}" placeholder="What helped me wait?" style="margin-top:6px"><div class="mu" style="margin-top:6px">Try instead: ${SUBS.join(' · ')}.</div>`;
  if(st.cur===0&&st.best>0)h+=`<div class="mu" style="margin-top:6px">Break झाला. आजपासून पुन्हा सुरू.</div>`}
 if(!noLink)h+=`<button class="g" data-det="${t.id}" style="min-height:40px;padding:4px 0;text-align:left">Details ›</button>`;
 return h+'</div>'}
// Optional daily check-in, saved inside the day's entry as .ci
function checkin(date){const c=(S.days[date]||{}).ci||{};
 return`<div class="card"><b>🌙 Daily check-in</b> <span class="mu">(optional)</span><div class="mu" style="margin-top:6px">How was today?</div>
 <div class="row">${['Good','Okay','Difficult'].map(m=>`<button class="${c.mood===m?'b':'g'}" style="${c.mood===m?'':'border:1px solid var(--bd);border-radius:12px'}" data-mood="${m}">${m}</button>`).join('')}</div>
 <input data-ci="done" value="${esc(c.done)}" placeholder="One thing I completed" style="margin-top:8px"><input data-ci="improve" value="${esc(c.improve)}" placeholder="One thing I want to improve" style="margin-top:6px"><textarea data-ci="note" rows="2" placeholder="Short note" style="margin-top:6px">${esc(c.note)}</textarea></div>`}
// Full details of one day, shown on the Journey page
function dayPanel(key){const n=dayNo(key),e=S.days[key]||{},c=e.ci||{};
 return`<div class="card dp"><b>Day ${n} / 90</b> <span class="mu">${parse(key).toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric'})}</span>
 ${T.map(t=>{const v=val(e,t.id),thr=t.id==='supari'?limit(key):t.t;return`<div class="row" style="justify-content:space-between;padding:3px 0"><span>${t.e} ${t.n}</span><span class="mu">${fmt(v,t.id)} / ${t.id==='sleep'?'7h':thr} · ${v===null?'No entry':ok(key,t)?'✓ Threshold met':'○ Not met'}</span></div>`}).join('')}
 ${c.mood?`<div class="mu" style="margin-top:6px">Check-in: ${esc(c.mood)}${c.done?' · Completed: '+esc(c.done):''}${c.improve?' · Improve: '+esc(c.improve):''}${c.note?' · '+esc(c.note):''}</div>`:''}
 <div class="mu" style="margin:8px 0"><i>${Q[Math.max(n,0)%Q.length]}</i></div><button class="b" data-go="${key}">Edit this day</button></div>`}
function ring(p){const r=52,c=2*Math.PI*r;return`<svg width="140" height="140" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--ac2)" stroke-width="9"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--ac)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 60 60)" style="transition:stroke-dasharray .8s"/></svg>`}
// ---------- time table ----------
// Each task: {id, d:[weekdays 0=Sun..6=Sat], s:'HH:MM', e:'HH:MM', t:title, k:linked tracker id or '', f:flexible?}
// A task is only a PLAN. Trackers are logged separately, so coding at another time still counts.
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function defaultTT(){let n=0;const mk=(d,s,e,t,k='',f=false,p=false)=>{const o={id:'n'+(n++),d,s,e,t,k,f};if(p)o.p=true;return o},all=[0,1,2,3,4,5,6];
 return[
 // Personal morning routine (NOT part of the college timetable)
 mk(all,'08:00','08:00','Wake up','',false,true),mk(all,'08:00','08:15','Brush / freshen up'),mk(all,'08:15','08:30','Bath / get ready'),mk(all,'08:30','08:45','Breakfast'),mk(all,'08:45','09:00','Bag / final preparation'),mk(all,'09:00','09:15','Leave for College'),
 // College (Mon-Fri) and TNP (Sat-Sun)
 mk([1,2],'09:15','17:30','College'),mk([3,4,5],'09:15','16:30','College'),mk([6,0],'09:30','17:30','TNP'),
 // Evening and night routine
 mk(all,'17:30','18:00','Freshen up & tea'),mk(all,'18:00','18:30','Reading','reading',true),mk(all,'18:30','19:00','Walking','walking',true),mk(all,'19:00','19:30','Quiet time / meditation','meditation',true),
 mk(all,'19:30','19:45','Setup'),mk(all,'19:45','20:45','Coding','coding'),mk(all,'20:45','21:00','Go to mess (closes 9 PM)'),mk(all,'21:00','21:30','Dinner'),
 mk(all,'21:30','22:15','College Study','study'),mk(all,'22:15','22:30','Break'),mk(all,'22:30','23:30','Flexible / personal','',true),mk(all,'23:30','00:30','Wind-down'),mk(all,'01:00','01:15','Sleep','sleep')]}
// The previous built-in schedule (ids d0-d16). Used only to upgrade saved timetables without touching custom tasks.
function oldDefaultTT(){let n=0;const mk=(d,s,e,t,k='',f=false)=>({id:'d'+(n++),d,s,e,t,k,f}),all=[0,1,2,3,4,5,6];
 return[mk([1,2,3],'09:15','17:30','College'),mk([4],'09:15','16:30','College'),mk([5],'09:15','15:15','College'),mk([6,0],'09:30','17:30','TNP'),

function say(t,c){const m=document.createElement('div');m.className='m '+c;m.textContent=t;$('msgs').append(m);$('msgs').scrollTop=1e9;return m}
$('fab').onclick=()=>{const c=$('chat');c.classList.toggle('open');
 if(!$('msgs').children.length)say(S.set.key?`Hi ${S.set.name}! How's your day going?`:'Hi! Add a Gemini key in Settings and we can chat. Until then, I\'ll be here cheering quietly 🌱','a')};
// All network access for Mitra lives in this ONE function.
// PROTOTYPE ONLY: mode 'direct' sends the key from the browser, so anyone who can open this page could read it.
// For production: set mode to 'proxy' and build a serverless endpoint that keeps the key on the server.
const MITRA={mode:'direct',endpoint:'/api/mitra',model:'gemini-2.5-flash'};
async function callMitra(contents,systemText){
 const direct=MITRA.mode==='direct';
 const url=direct?`https://generativelanguage.googleapis.com/v1beta/models/${MITRA.model}:generateContent`:MITRA.endpoint;
 const headers={'Content-Type':'application/json'};if(direct)headers['x-goog-api-key']=S.set.key;
 const r=await fetch(url,{method:'POST',headers,body:JSON.stringify({systemInstruction:{parts:[{text:systemText}]},contents})});
 const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);
 return j.candidates[0].content.parts.map(p=>p.text).join('')}
async function ask(){const i=$('cin'),q=i.value.trim();if(!q)return;i.value='';say(q,'u');
 if(MITRA.mode==='direct'&&!S.set.key){say('I need a Gemini key first — add one in Settings.','a');return}
 hist.push({role:'user',parts:[{text:q}]});const w=say('…','a');
 const sys=mitraContext();
 try{const a=await callMitra(hist,sys);hist.push({role:'model',parts:[{text:a}]});w.textContent=a}
 catch(e){hist.pop();w.textContent='I couldn\'t reach Gemini ('+e.message+'). Check your key and connection.'}}
$('csend').onclick=ask;$('cin').onkeydown=e=>{if(e.key==='Enter')ask()};
// ---------- start ----------
$('app').addEventListener('animationend',e=>{if(e.target.id==='app')e.target.classList.remove('pg')});
setInterval(()=>{if(view==='home'&&!document.activeElement.matches('input,textarea,select'))render()},30000); // keeps "Now / Next" current
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view==='home')render()});
render();if(!S.set.onboarded)onboard();
</script></body></html>
